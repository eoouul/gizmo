<!-- GIZMO 홈. 프로젝트 카드와 소식은 projects.js 의 목록으로 그립니다. -->
<meta name="description" content="게임 동아리 GIZMO의 프로젝트와 개발 소식.">
<title>GIZMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">

<header class="bar">
  <div class="wrap">
    <a class="mark" href="#top" aria-label="GIZMO 처음으로"><span class="pip" aria-hidden="true"></span>GIZMO</a>
    <nav aria-label="페이지 목차">
      <a href="#projects">프로젝트</a>
      <a href="#news">소식</a>
      <a href="#club">동아리</a>
    </nav>
  </div>
</header>

<main id="top">
  <section class="home-hero wrap" aria-labelledby="home-title">
    <p class="eyebrow">게임 만드는 동아리</p>
    <h1 class="wordmark" id="home-title"><span class="pip" aria-hidden="true"></span>GIZMO</h1>
    <p class="lede">여러 게임을 동시에 만들고 있습니다. 진행 중인 프로젝트와 빌드 소식을 여기에 모읍니다.</p>
    <p class="home-meta" id="home-meta"></p>
  </section>

  <section class="block" id="projects" aria-labelledby="projects-title">
    <div class="wrap">
      <div class="head">
        <p class="eyebrow">프로젝트</p>
        <h2 id="projects-title">만들고 있는 것들</h2>
      </div>
      <div class="projects" id="project-grid"></div>
      <noscript><p class="quiet">프로젝트 목록은 자바스크립트로 그립니다. <a href="projects/roulette-warrior/">ROULETTE WARRIOR 페이지</a>로 바로 갈 수 있습니다.</p></noscript>
    </div>
  </section>

  <section class="block" id="news" aria-labelledby="news-title">
    <div class="wrap">
      <div class="head">
        <p class="eyebrow">소식 · 모든 프로젝트</p>
        <h2 id="news-title">최근 빌드</h2>
      </div>
      <ol class="news" id="news-list"></ol>
    </div>
  </section>

  <section class="block" id="club" aria-labelledby="club-title">
    <div class="wrap club">
      <div class="head" style="margin-bottom: 0;">
        <p class="eyebrow">만드는 사람들</p>
        <h2 id="club-title">GIZMO</h2>
        <p class="lede">GIZMO는 게임을 만드는 동아리입니다. 프로젝트마다 빌드가 나오면 이 사이트의 소식과 각 프로젝트 페이지를 고칩니다.</p>
      </div>
      <dl class="facts" id="club-facts"></dl>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© 2026 GIZMO</span>
    <span>제목 글꼴 물마루(Mulmaru) · SIL Open Font License 1.1</span>
  </div>
</footer>

<script src="projects.js"></script>
<script src="title-scene.js"></script>
<script>
(() => {
  const projects = window.GIZMO_PROJECTS || [];
  const news = (window.GIZMO_NEWS || []).slice().sort((a, b) => b.date.localeCompare(a.date));
  const bySlug = Object.fromEntries(projects.map((p) => [p.slug, p]));
  const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // cover 가 "scene" 인 프로젝트는 게임 타이틀 화면 레이어를 그대로 겹쳐 보여 줍니다.
  const sceneCover = () => `
    <div class="scene" aria-hidden="true">
      <div class="layer sky"></div>
      <div class="layer cloud2"></div><div class="layer cloud"></div>
      <div class="layer mountain2"></div><div class="layer mountain"></div>
      <div class="layer grass3"></div><div class="layer glow"></div>
      <div class="layer machine"></div><div class="layer grass"></div>
      <img class="layer logo" src="assets/logo.webp" alt="" width="1400" height="700">
      <canvas class="title-canvas" role="img" aria-label="ROULETTE WARRIOR 타이틀 화면"></canvas>
    </div>`;
  const cover = (p) => {
    if (p.cover === "scene") return sceneCover();
    if (p.cover) return `<img src="${esc(p.cover)}" alt="" loading="lazy">`;
    return `<div class="cover-pattern" style="--acc: ${esc(p.accent || "#3BF5A4")}"><span>${esc(p.name)}</span></div>`;
  };
  const statusClass = (s) => (s === "개발 중" ? "live" : s === "출시" ? "shipped" : "");

  const card = (p) => {
    const title = p.page ? `<a href="${esc(p.page)}">${esc(p.name)}</a>` : esc(p.name);
    const facts = [["엔진", p.engine], ["기간", p.period], ["버전", p.version]]
      .filter(([, v]) => v)
      .map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join("");
    const links = (p.links || []).map((l) => `<a href="${esc(l.href)}">${esc(l.label)}</a>`).join("");
    const tags = (p.tags || []).map((t) => `<li>${esc(t)}</li>`).join("");
    return `
      <article class="card${p.featured ? " featured" : ""}${p.placeholder ? " placeholder" : ""}" aria-labelledby="p-${esc(p.slug)}">
        <div class="cover">${cover(p)}</div>
        <div class="body">
          <div class="row"><span class="kind">${esc(p.kind)}</span><span class="status ${statusClass(p.status)}">${esc(p.status)}</span>${p.placeholder ? `<span class="kind">준비 중 · 임시</span>` : ""}</div>
          <h3 id="p-${esc(p.slug)}">${title}</h3>
          <p class="summary">${esc(p.summary)}</p>
          ${tags ? `<ul class="tags" aria-label="태그">${tags}</ul>` : ""}
          ${facts ? `<dl class="facts">${facts}</dl>` : ""}
          ${links ? `<div class="links">${links}</div>` : ""}
        </div>
      </article>`;
  };

  // 대표 카드는 한 줄을 통째로 쓰고, 나머지는 따로 한 줄에 모아 빈 칸 없이 채웁니다.
  const featured = projects.filter((p) => p.featured);
  const others = projects.filter((p) => !p.featured);
  document.getElementById("project-grid").innerHTML =
    featured.map(card).join("") +
    (others.length ? `<div class="project-row">${others.map(card).join("")}</div>` : "");

  // 대표 카드의 타이틀 화면도 게임과 같은 방식(WebGL)으로 그립니다. 안 되면 CSS 레이어 그대로.
  document.querySelectorAll("#project-grid .scene").forEach((scene) => {
    const c = scene.querySelector(".title-canvas");
    if (window.GizmoTitleScene && window.GizmoTitleScene.mount(c, { images: {
      sky: "assets/sky.png", cloud: "assets/cloud.png", cloud2: "assets/cloud2.png",
      mountain: "assets/mountain.png", mountain2: "assets/mountain2.png",
      grass: "assets/grass.png", grass3: "assets/grass3.png",
      machine: "assets/machine.png", meteor: "assets/meteor.png", meteor2: "assets/meteor2.png",
      logo: "assets/logo.webp", light: "assets/light.png"
    } })) {
      scene.classList.add("webgl");
      c.addEventListener("titlescene:failed", () => scene.classList.remove("webgl"));
    }
  });

  document.getElementById("news-list").innerHTML = news.slice(0, 8).map((n) => {
    const p = bySlug[n.project];
    const label = p ? p.name : n.project;
    const title = n.href ? `<a href="${esc(n.href)}">${esc(n.title)}</a>` : esc(n.title);
    return `<li><time datetime="${esc(n.date)}">${esc(n.date)}</time><span class="proj">${esc(label)}</span><span>${title}</span></li>`;
  }).join("");

  // 개수는 실제 프로젝트만 셉니다. placeholder(임시) 항목은 카드로만 보이고 숫자에는 안 들어갑니다.
  const real = projects.filter((p) => !p.placeholder);
  const active = real.filter((p) => p.status === "개발 중").length;
  const engines = [...new Set(real.map((p) => (p.engine || "").split(" ")[0]).filter(Boolean))];
  document.getElementById("home-meta").innerHTML =
    `<span>프로젝트 <b>${real.length}</b></span><span>개발 중 <b>${active}</b></span>` +
    (news[0] ? `<span>최근 소식 <b>${esc(news[0].date)}</b></span>` : "");
  document.getElementById("club-facts").innerHTML =
    `<dt>프로젝트</dt><dd>${real.length}개</dd>` +
    (engines.length ? `<dt>엔진</dt><dd>${esc(engines.join(" · "))}</dd>` : "") +
    `<dt>사이트</dt><dd><a href="https://github.com/eoouul/gizmo">github.com/eoouul/gizmo</a></dd>`;
})();
</script>
